[package]
name = "readsubtitles-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true

[[bin]]
name = "readsubtitles"
path = "src/main.rs"

[dependencies]
readsubtitles-browser = { path = "../browser" }
readsubtitles-capture = { path = "../capture" }
readsubtitles-ocr = { path = "../ocr" }
readsubtitles-cues = { path = "../cues" }
readsubtitles-diarize = { path = "../diarize" }
readsubtitles-voice = { path = "../voice" }
objc2.workspace = true
objc2-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-app-kit = { version = "0.3.2", features = [
  "NSApplication", "NSResponder", "NSStatusBar", "NSStatusItem",
  "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSMenu",
  "NSMenuItem", "NSRunningApplication", "NSWindow", "NSPanel", "NSScreen",
  "NSColor", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSBezierPath",
  "NSCell", "NSText", "NSTextField", "NSImage",
] }
global-hotkey = "0.7.0"
