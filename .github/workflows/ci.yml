name: CI

# macOS only, and not for convenience: this builds against ScreenCaptureKit,
# Vision and AVFoundation, none of which exist anywhere else.
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Do NOT set RUSTFLAGS here. Cargo treats the environment variable as a
  # replacement for the rustflags in .cargo/config.toml, not an addition to
  # them, so setting it drops the Swift runtime search path and rpath that
  # screencapturekit's Swift shim needs. The binaries then build cleanly and
  # abort at launch with "Library not loaded: @rpath/libswift_Concurrency.dylib".
  # Warnings are denied on the clippy invocation instead, where it is scoped.

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # install.sh is how most people will meet this project, so a broken
      # script is worse than a broken crate.
      - name: Shell scripts
        run: |
          brew list shellcheck >/dev/null 2>&1 || brew install shellcheck
          shellcheck install.sh bundle/*.sh

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The tests that matter here are pure: cue timing, speaker clustering,
      # pitch, voice assignment. None need a screen, a microphone or a model
      # file, so they run unchanged on a headless runner.
      - name: Test
        run: cargo test --workspace

      - name: Check the minimum supported Rust version still builds
        run: |
          rustup toolchain install 1.92 --profile minimal
          cargo +1.92 check --workspace
